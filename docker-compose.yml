services:

  # ── Site institucional (nginx estático) ────────────────────
  # O nome do serviço precisa ser "www-pybots": é a ele que o
  # domínio www.pybots.com.br está vinculado no Dokploy.
  www-pybots:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: www-pybots
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
