<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PyBots Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e2a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6eaf4;--muted:#7c8ba1;--dim:#4a5568;
  --accent:#5865F2;--accent2:#7983f5;
  --green:#3dd68c;--yellow:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--cyan:#06b6d4;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

/* ── SIDEBAR ── */
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.sb-logo .accent{color:var(--accent2)}
.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.sb-section{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 10px 5px;margin-top:6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.sb-item.active{background:rgba(88,101,242,.15);color:var(--accent2)}
.sb-item .ic{width:18px;text-align:center;font-size:.95rem}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border);font-size:.73rem;color:var(--dim);line-height:1.7}
.live-dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:24px;max-width:1200px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-title{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.page-sub{font-size:.8rem;color:var(--muted);margin-top:3px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
.ptab{padding:5px 12px;border-radius:6px;font-size:.78rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s;user-select:none}
.ptab.active{background:var(--accent);color:#fff}
.btn-refresh{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .18s;font-family:var(--font)}
.btn-refresh:hover{border-color:var(--border2);color:var(--text)}

/* ── CARDS ── */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.card-lbl{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.card-val{font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.card-sub{font-size:.74rem;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.up{color:var(--green);font-weight:600}
.dn{color:var(--red);font-weight:600}

/* ── GRID 2 cols ── */
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px}
.panel-title{font-size:.88rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.panel-title span{font-size:.72rem;font-weight:500;color:var(--muted)}

/* ── FUNIL ── */
.funnel-steps{display:flex;flex-direction:column;gap:10px}
.f-step{display:grid;grid-template-columns:170px 1fr 60px 52px;align-items:center;gap:10px}
.f-lbl{font-size:.81rem;color:var(--muted)}
.f-bar-wrap{background:var(--bg3);border-radius:100px;height:8px;overflow:hidden}
.f-bar{height:100%;border-radius:100px;transition:width 1s ease}
.f-cnt{font-size:.84rem;font-weight:700;text-align:right}
.f-pct{font-size:.74rem;color:var(--muted);text-align:right}
.f-arrow{grid-column:1/-1;font-size:.72rem;color:var(--dim);padding-left:172px}

/* ── LISTAS ── */
.list-rows{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-left{display:flex;align-items:center;gap:9px;font-size:.82rem}
.rank-n{width:18px;font-size:.72rem;font-weight:700;color:var(--dim)}
.rank-n.g{color:var(--yellow)}.rank-n.s{color:#94a3b8}.rank-n.b{color:#b45309}
.mini-bar{width:55px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:3px}
.mini-bar-fill{height:100%;border-radius:2px;background:var(--accent)}
.list-right{text-align:right}
.list-cnt{font-size:.84rem;font-weight:700;color:var(--accent2)}
.list-sub{font-size:.72rem;color:var(--dim)}
.top1-lbl{font-size:.68rem;font-weight:700;color:var(--yellow);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);padding:2px 7px;border-radius:100px;margin-top:3px;display:inline-block}
.dot8{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── TABELA ── */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
.table-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.table-header h3{font-size:.88rem;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fsel{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:.76rem;padding:5px 10px;border-radius:7px;outline:none;font-family:var(--font);cursor:pointer}
.fsel:focus{border-color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 16px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
td{font-size:.8rem;padding:10px 16px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:.69rem;font-weight:600}
.b-produto  {background:rgba(88,101,242,.14);color:var(--accent2)}
.b-contato  {background:rgba(61,214,140,.12);color:var(--green)}
.b-formulario{background:rgba(245,158,11,.12);color:var(--yellow)}
.b-video    {background:rgba(239,68,68,.12);color:var(--red)}
.b-scroll   {background:rgba(139,92,246,.12);color:var(--purple)}
.b-visibilidade{background:rgba(6,182,212,.12);color:var(--cyan)}
.b-engajamento {background:rgba(245,158,11,.1);color:var(--yellow)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted)}
.pager button{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;font-family:var(--font)}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* ── SKELETON LOADER ── */
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;display:inline-block}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.85rem}
.empty-icon{font-size:2.5rem;margin-bottom:10px}

/* ── RESPONSIVE ── */
@media(max-width:1024px){.cards{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.sidebar{display:none}.cards{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr}.f-step{grid-template-columns:140px 1fr 50px 44px}}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">🐍 Py<span class="accent">Bots</span></div>
  <nav class="sb-nav">
    <div class="sb-section">Principal</div>
    <div class="sb-item active" data-page="overview"><span class="ic">📊</span> Visão Geral</div>
    <div class="sb-item" data-page="products"><span class="ic">🔥</span> Produtos</div>
    <div class="sb-item" data-page="funnel"><span class="ic">🎯</span> Funil Contato</div>
    <div class="sb-item" data-page="geo"><span class="ic">🌍</span> Localização</div>
    <div class="sb-section">Dados</div>
    <div class="sb-item" data-page="events"><span class="ic">📋</span> Eventos</div>
    <div class="sb-item" data-page="videos"><span class="ic">▶️</span> Vídeos</div>
  </nav>
  <div class="sb-footer">
    <span class="live-dot"></span>Coletando dados<br>
    <span id="last-update">—</span>
  </div>
</aside>

<!-- MAIN -->
<main class="main" id="mainContent">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <div class="page-title" id="pageTitle">Visão Geral</div>
      <div class="page-sub" id="pageSub">Carregando...</div>
    </div>
    <div class="header-right">
      <div class="period-tabs" id="periodTabs">
        <div class="ptab" data-period="1d">Hoje</div>
        <div class="ptab active" data-period="7d">7 dias</div>
        <div class="ptab" data-period="30d">30 dias</div>
        <div class="ptab" data-period="all">Total</div>
      </div>
      <button class="btn-refresh" id="btnRefresh">↻ Atualizar</button>
    </div>
  </div>

  <!-- CONTEÚDO DINÂMICO -->
  <div id="pageBody"></div>

</main>

<script>
'use strict';

// ── Estado global ──
let currentPeriod = '7d';
let currentPage   = 'overview';
let eventsPage    = 1;
let eventsCategory = '';
let autoRefreshId  = null;

// ── Utils ──
const $  = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);

async function apiFetch(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function fmt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('pt-BR');
}

function pctBadge(v) {
  if (v == null) return '';
  const cls = v >= 0 ? 'up' : 'dn';
  const sign = v >= 0 ? '↑ +' : '↓ ';
  return `<span class="${cls}">${sign}${Math.abs(v)}%</span>`;
}

function badgeClass(category) {
  const map = {
    produto:'b-produto', contato:'b-contato', formulario:'b-formulario',
    video:'b-video', scroll:'b-scroll', visibilidade:'b-visibilidade',
    engajamento:'b-engajamento'
  };
  return map[category] || 'b-scroll';
}

function updateLastUpdate() {
  const now = new Date();
  $('last-update').textContent = now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

// ── Renderizadores ──

function renderCards(data) {
  return `
    <div class="cards">
      <div class="card">
        <div class="card-lbl">Visitantes únicos</div>
        <div class="card-val" id="cv-visitors">${fmt(data.visitors)}</div>
        <div class="card-sub">${pctBadge(data.visitors_pct)} vs período anterior</div>
      </div>
      <div class="card">
        <div class="card-lbl">Sessões</div>
        <div class="card-val">${fmt(data.sessions)}</div>
        <div class="card-sub" style="color:var(--muted)">Período selecionado</div>
      </div>
      <div class="card">
        <div class="card-lbl">Cliques em produtos</div>
        <div class="card-val">${fmt(data.product_clicks)}</div>
        <div class="card-sub" style="color:var(--muted)">Botões de produto clicados</div>
      </div>
      <div class="card">
        <div class="card-lbl">Contatos iniciados</div>
        <div class="card-val">${fmt(data.contacts)}</div>
        <div class="card-sub" style="color:var(--muted)">WhatsApp + formulários</div>
      </div>
    </div>`;
}

function renderTimeline(rows) {
  return `
    <div class="panel">
      <div class="panel-title">Visitantes por dia <span>últimos 30 dias</span></div>
      <canvas id="lineChart" height="75"></canvas>
    </div>`;
}

function renderDevices(rows) {
  const labels = rows.map(r => r.device);
  const values = rows.map(r => r.total);
  return `
    <div class="panel">
      <div class="panel-title">Dispositivos</div>
      <canvas id="donutChart" height="160"></canvas>
      <script>
        new Chart(document.getElementById('donutChart'), {
          type:'doughnut',
          data:{labels:${JSON.stringify(labels)},datasets:[{data:${JSON.stringify(values)},backgroundColor:['#5865F2','#3dd68c','#f59e0b'],borderWidth:0,hoverOffset:4}]},
          options:{responsive:true,cutout:'72%',plugins:{legend:{position:'bottom',labels:{color:'#7c8ba1',font:{size:11},padding:10,boxWidth:10}},tooltip:{backgroundColor:'#1a1e2a',titleColor:'#e6eaf4',bodyColor:'#7c8ba1'}}}
        });
      <\/script>
    </div>`;
}

function renderProducts(rows) {
  const max = rows[0]?.clicks || 1;
  const items = rows.map((r, i) => {
    const rankClass = i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : '';
    const top1 = i === 0 ? '<div class="top1-lbl">🔥 Top 1</div>' : '';
    const pct = Math.round((r.clicks / max) * 100);
    return `
      <div class="list-row">
        <div class="list-left">
          <span class="rank-n ${rankClass}">${i+1}</span>
          <div>
            <div>${r.label}</div>
            <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
        <div class="list-right">
          <div class="list-cnt">${fmt(r.clicks)}</div>
          ${top1}
        </div>
      </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-title">🔥 Ranking de Produtos</div><div class="list-rows">${items || '<div class="empty"><div class="empty-icon">📭</div>Sem dados ainda</div>'}</div></div>`;
}

function renderCountries(rows) {
  const flags = {Brazil:'🇧🇷',Portugal:'🇵🇹',Angola:'🇦🇴','United States':'🇺🇸',Mozambique:'🇲🇿',Spain:'🇪🇸',France:'🇫🇷',Germany:'🇩🇪',Argentina:'🇦🇷',Colombia:'🇨🇴'};
  const total = rows.reduce((s,r) => s + r.visitors, 0) || 1;
  const items = rows.map((r, i) => {
    const rankClass = i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : '';
    const flag = flags[r.country] || '🌐';
    const pct = Math.round((r.visitors / total) * 100);
    return `
      <div class="list-row">
        <div class="list-left">
          <span class="rank-n ${rankClass}">${i+1}</span>
          <span style="font-size:1.1rem">${flag}</span>
          <span>${r.country || 'Desconhecido'}</span>
        </div>
        <div class="list-right">
          <div class="list-cnt">${fmt(r.visitors)}</div>
          <div class="list-sub">${pct}%</div>
        </div>
      </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-title">🌍 Top Países</div><div class="list-rows">${items || '<div class="empty"><div class="empty-icon">🌍</div>Sem dados ainda</div>'}</div></div>`;
}

function renderReferrers(rows) {
  const icons = {Telegram:'💬',Google:'🔍',WhatsApp:'📱',GitHub:'🐙',Instagram:'📸',Facebook:'📘',Direto:'🌐'};
  const items = rows.map((r, i) => {
    const ic = icons[r.source] || '🔗';
    return `
      <div class="list-row">
        <div class="list-left">
          <span class="rank-n ${i===0?'g':i===1?'s':i===2?'b':''}">${i+1}</span>
          <span>${ic}</span>
          <span>${r.source}</span>
        </div>
        <div class="list-right"><div class="list-cnt">${fmt(r.visitors)}</div></div>
      </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-title">📡 Fontes de Tráfego</div><div class="list-rows">${items || '<div class="empty"><div class="empty-icon">📡</div>Sem dados ainda</div>'}</div></div>`;
}

function renderFunnel(steps) {
  const colors = ['var(--accent)','var(--accent2)','var(--cyan)','var(--yellow)','#25D366','var(--green)'];
  const rows = steps.map((s, i) => {
    const arrow = i < steps.length - 1
      ? `<div class="f-arrow">↓</div>` : '';
    return `
      <div class="f-step">
        <div class="f-lbl">${s.step}</div>
        <div class="f-bar-wrap"><div class="f-bar" style="width:${s.pct}%;background:${colors[i]}"></div></div>
        <div class="f-cnt" style="color:${colors[i]}">${fmt(s.count)}</div>
        <div class="f-pct">${s.pct}%</div>
      </div>${arrow}`;
  }).join('');
  return `
    <div class="panel" style="grid-column:1/-1">
      <div class="panel-title">🎯 Funil de Contato — De visitante a lead</div>
      <div class="funnel-steps">${rows || '<div class="empty"><div class="empty-icon">🎯</div>Sem dados ainda</div>'}</div>
    </div>`;
}

function renderEventsTable(data, catFilter) {
  const catOptions = ['','produto','contato','formulario','video','scroll','visibilidade','engajamento']
    .map(c => `<option value="${c}" ${c === catFilter ? 'selected':''}>${c || 'Todos'}</option>`).join('');

  const rows = (data.rows || []).map(r => `
    <tr>
      <td style="color:var(--muted);font-family:var(--mono);font-size:.75rem">${r.created_at?.slice(11,19) || '—'}</td>
      <td>${r.city ? `${r.city}, ` : ''}${r.country || '—'}</td>
      <td>${r.device === 'mobile' ? '📱' : r.device === 'tablet' ? '📟' : '🖥'} ${r.device || '—'}</td>
      <td><span class="badge ${badgeClass(r.category)}">${r.category || r.type}</span></td>
      <td style="color:var(--text)">${r.label || '—'}</td>
      <td style="color:var(--dim);font-size:.75rem">${r.value || '—'}</td>
      <td style="color:var(--dim);font-size:.75rem;max-width:160px;overflow:hidden;text-overflow:ellipsis">${r.referrer || 'Direto'}</td>
    </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">Nenhum evento encontrado</td></tr>`;

  const total = data.total || 0;
  const pages = Math.ceil(total / (data.page_size || 50));

  return `
    <div class="table-wrap">
      <div class="table-header">
        <h3>Eventos recentes <span style="color:var(--dim);font-weight:400">(${fmt(total)} total)</span></h3>
        <div class="filters">
          <select class="fsel" id="catFilter">${catOptions}</select>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Hora</th><th>Localização</th><th>Dispositivo</th>
            <th>Categoria</th><th>Label</th><th>Valor</th><th>Fonte</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="pager">
        <span>Pág. ${data.page} de ${pages || 1}</span>
        <button id="prevPage" ${data.page <= 1 ? 'disabled':''}>← Anterior</button>
        <button id="nextPage" ${data.page >= pages ? 'disabled':''}>Próxima →</button>
      </div>
    </div>`;
}

function renderVideos(rows) {
  const items = rows.map((r, i) => `
    <div class="list-row">
      <div class="list-left">
        <span class="rank-n ${i===0?'g':i===1?'s':i===2?'b':''}">${i+1}</span>
        <span>▶</span>
        <span>${r.label}</span>
      </div>
      <div class="list-right"><div class="list-cnt" style="color:var(--red)">${fmt(r.plays)} plays</div></div>
    </div>`).join('');
  return `<div class="panel" style="grid-column:1/-1"><div class="panel-title">▶️ Plays de Vídeo por Produto</div><div class="list-rows">${items || '<div class="empty"><div class="empty-icon">▶️</div>Sem plays registrados ainda</div>'}</div></div>`;
}

// ── Páginas ──

async function loadOverview() {
  $('pageTitle').textContent = 'Visão Geral';
  const pb = $('pageBody');
  pb.innerHTML = '<div class="cards">' + Array(4).fill('<div class="card"><div class="skel" style="width:80px;height:12px;margin-bottom:12px"></div><div class="skel" style="width:60px;height:30px"></div></div>').join('') + '</div>';

  try {
    const [overview, timeline, devices, products, countries, referrers] = await Promise.all([
      apiFetch(`/analytics/api/overview?period=${currentPeriod}`),
      apiFetch('/analytics/api/timeline?days=30'),
      apiFetch(`/analytics/api/devices?period=${currentPeriod}`),
      apiFetch(`/analytics/api/products?period=${currentPeriod}`),
      apiFetch(`/analytics/api/countries?period=${currentPeriod}`),
      apiFetch(`/analytics/api/referrers?period=${currentPeriod}`),
    ]);

    $('pageSub').textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · período: ${currentPeriod}`;

    pb.innerHTML =
      renderCards(overview) +
      `<div class="row2">${renderTimeline(timeline)}${renderDevices(devices)}</div>` +
      `<div class="row3">${renderProducts(products)}${renderCountries(countries)}${renderReferrers(referrers)}</div>`;

    // Chart linha
    const tLabels = timeline.map(r => r.day?.slice(5));
    const tData   = timeline.map(r => r.visitors);
    new Chart(document.getElementById('lineChart'), {
      type:'line',
      data:{labels:tLabels,datasets:[{label:'Visitantes',data:tData,borderColor:'#5865F2',backgroundColor:'rgba(88,101,242,.08)',borderWidth:2,pointRadius:0,pointHoverRadius:4,fill:true,tension:.4}]},
      options:{responsive:true,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,backgroundColor:'#1a1e2a',titleColor:'#e6eaf4',bodyColor:'#7c8ba1',borderColor:'rgba(255,255,255,.1)',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4a5568',maxTicksLimit:10,font:{size:11}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4a5568',font:{size:11}}}}}
    });

  } catch(e) {
    pb.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Erro ao carregar dados: ${e.message}</div>`;
  }
}

async function loadProducts() {
  $('pageTitle').textContent = 'Produtos';
  $('pageSub').textContent = 'Ranking de cliques por produto';
  const pb = $('pageBody');
  pb.innerHTML = '<div class="empty">Carregando...</div>';
  try {
    const rows = await apiFetch(`/analytics/api/products?period=${currentPeriod}`);
    pb.innerHTML = `<div class="row3" style="grid-template-columns:1fr">${renderProducts(rows)}</div>`;
  } catch(e) {
    pb.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
  }
}

async function loadGeo() {
  $('pageTitle').textContent = 'Localização';
  $('pageSub').textContent = 'Países e cidades dos visitantes';

    ]);

  } catch(e) {

}

async function loadEvents() {
  $('pageTitle').textContent = 'Eventos';
  $('pageSub').textContent = 'Log de todos os eventos coletados';
  const pb = $('pageBody');
  pb.innerHTML = '<div class="empty">Carregando...</div>';
  try {
    const catParam = eventsCategory ? `&category=${eventsCategory}` : '';
    const data = await apiFetch(`/analytics/api/events?page=${eventsPage}&period=${currentPeriod}${catParam}`);
    pb.innerHTML = renderEventsTable(data, eventsCategory);

    // Filtro categoria
    document.getElementById('catFilter')?.addEventListener('change', e => {
      eventsCategory = e.target.value;
      eventsPage = 1;
      loadEvents();
    });
    document.getElementById('prevPage')?.addEventListener('click', () => { eventsPage--; loadEvents(); });
    document.getElementById('nextPage')?.addEventListener('click', () => { eventsPage++; loadEvents(); });
  } catch(e) {
    pb.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
  }
}

async function loadVideos() {
  $('pageTitle').textContent = 'Vídeos';
  $('pageSub').textContent = 'Plays por produto';
  const pb = $('pageBody');
  pb.innerHTML = '<div class="empty">Carregando...</div>';
  try {
    const rows = await apiFetch(`/analytics/api/videos?period=${currentPeriod}`);
    pb.innerHTML = `<div class="row3" style="grid-template-columns:1fr">${renderVideos(rows)}</div>`;
  } catch(e) {
    pb.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
  }
}

const pageLoaders = {
  overview: loadOverview,
  products: loadProducts,
  funnel:   loadFunnel,
  geo:      loadGeo,
  events:   loadEvents,
  videos:   loadVideos,
};

function loadPage(page) {
  currentPage = page;
  document.querySelectorAll('.sb-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page)
  );
  pageLoaders[page]?.();
  updateLastUpdate();
}

// ── Event listeners ──

document.querySelectorAll('.sb-item').forEach(el => {
  el.addEventListener('click', () => loadPage(el.dataset.page));
});

document.querySelectorAll('.ptab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentPeriod = tab.dataset.period;
    eventsPage = 1;
    loadPage(currentPage);
  });
});

$('btnRefresh').addEventListener('click', () => loadPage(currentPage));

// ── Auto-refresh 60s ──
function startAutoRefresh() {
  clearInterval(autoRefreshId);
  autoRefreshId = setInterval(() => {
    loadPage(currentPage);
  }, 60_000);
}

// ── Init ──
loadPage('overview');
startAutoRefresh();
</script>
</body>
</html>
